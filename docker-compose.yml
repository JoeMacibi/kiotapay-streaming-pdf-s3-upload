services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck: {test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 5s, timeout: 3s, retries: 20}
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ["9000:9000", "9001:9001"]
  minio-init:
    image: minio/mc:latest
    depends_on: {minio: {condition: service_started}}
    entrypoint: /bin/sh
    command: -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done; mc mb --ignore-existing local/invoices"
  app:
    build: .
    ports: ["8080:8080"]
    depends_on: {rabbitmq: {condition: service_healthy}, minio-init: {condition: service_completed_successfully}}
    environment: {RABBITMQ_HOST: rabbitmq, S3_ENDPOINT: http://minio:9000, S3_ACCESS_KEY: minioadmin, S3_SECRET_KEY: minioadmin}

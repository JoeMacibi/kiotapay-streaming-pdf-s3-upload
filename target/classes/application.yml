server:
  port: ${PORT:8080}
spring:
  application.name: kiotapay-streaming-invoice
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener.simple:
      concurrency: ${WORKER_CONCURRENCY:2}
      max-concurrency: ${WORKER_CONCURRENCY:2}
      prefetch: ${RABBITMQ_PREFETCH:2}
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
app:
  queue: invoices
  bucket: ${S3_BUCKET:invoices}
  s3-endpoint: ${S3_ENDPOINT:http://localhost:9000}
  s3-region: ${S3_REGION:us-east-1}
  s3-access-key: ${S3_ACCESS_KEY:minioadmin}
  s3-secret-key: ${S3_SECRET_KEY:minioadmin}
  multipart-part-size: ${S3_PART_SIZE:5242880}
